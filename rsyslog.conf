# Replaces the image's rsyslog setup: the ColumnStore daemons log through
# syslog only, and this forwards what they log to the container's stdout,
# where docker logs picks it up. PID 1 is columnstore-entrypoint.sh.
#
# rsyslog runs as root (no privilege drop) to be able to open PID 1's stdout.
# Debug is left out: it logs the start and end of every SQL statement.

module(load="imuxsock")

template(name="docker" type="string"
         string="%timegenerated:::date-rfc3339% %programname%[%procid%]:%msg:::sp-if-no-1st-sp%%msg%\n")

*.info action(type="omfile" file="/proc/1/fd/1" template="docker")
